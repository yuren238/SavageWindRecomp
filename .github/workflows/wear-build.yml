# Builds the app on a pristine Windows runner, optionally with an older clang or an older
# mingw-w64 CRT taken from the MSYS2 archive, and uploads each exe.
#
# Why: the release (v0.5.3-alpha.5, published 2026-11-12) runs, every build made with the
# current MSYS2 UCRT64 (clang 23.1.5, crt r598) dies at the first guest call, on any machine.
# These variants walk the toolchain back to the packages that were current at release time.
name: wear-build

on:
  workflow_dispatch:
  push:
    branches: [local/weapon-wear-053, local/plain-053]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [base, clang-23.1.4, crt-r569, both]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-lld mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-tools mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-nasm
      - name: Toolchain back to the release date
        if: matrix.variant != 'base'
        run: |
          A=https://repo.msys2.org/mingw/ucrt64
          pkgs=""
          case "${{ matrix.variant }}" in
            *clang*) pkgs="$pkgs $A/mingw-w64-ucrt-x86_64-clang-23.1.4-2-any.pkg.tar.zst"
                     pkgs="$pkgs $A/mingw-w64-ucrt-x86_64-clang-libs-23.1.4-2-any.pkg.tar.zst"
                     pkgs="$pkgs $A/mingw-w64-ucrt-x86_64-llvm-libs-23.1.4-2-any.pkg.tar.zst"
                     pkgs="$pkgs $A/mingw-w64-ucrt-x86_64-lld-23.1.4-2-any.pkg.tar.zst" ;;
          esac
          case "${{ matrix.variant }}" in
            *crt*) pkgs="$pkgs $A/mingw-w64-ucrt-x86_64-crt-14.0.0.r569.g34eeafb7d-1-any.pkg.tar.zst" ;;
          esac
          pacman -U --noconfirm $pkgs || pacman -U --noconfirm --nodeps $pkgs
      - name: Toolchain fingerprint
        run: |
          clang --version | head -2
          pacman -Q mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-clang-libs \
                     mingw-w64-ucrt-x86_64-llvm-libs mingw-w64-ucrt-x86_64-lld \
                     mingw-w64-ucrt-x86_64-crt mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-ffmpeg || true
      - name: Build
        run: |
          make -j$(nproc) RELEASE=1 B=build 2>&1 | tail -30
          ls -l build/savagewind.exe build/savagewind.dll.a
      - name: Fingerprint of the exe
        run: |
          echo "--- version string:"; strings -a build/savagewind.exe | grep -oE '0\.[0-9]+\.[0-9]+-alpha\.[0-9]+' | sort -u || true
          echo "--- game lib id:";     strings -a build/savagewind.exe | grep -oE '[0-9a-f]{16}' | sort -u | head -5
          echo "--- CRT TLS symbols:"; nm --defined-only build/savagewind.exe 2>/dev/null | grep -iE 'tls_callback|_tls_used' || true
          echo "--- .tls size:";       objdump -h build/savagewind.exe | grep -E ' \.tls'
          echo "--- game code inside (must be empty):"; nm build/savagewind.exe 2>/dev/null | grep ' f_70' | head -3 || true
      - uses: actions/upload-artifact@v4
        with:
          name: savagewind-${{ matrix.variant }}
          path: build/savagewind.exe
          if-no-files-found: error
